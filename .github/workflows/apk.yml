name: Android APK

# Builds what people install: the phone app (malves.apk), the Chrome extension
# (malves-chrome.zip, loaded unpacked) and the IDE extension (malves.vsix).
# Run it by hand (Actions → Android APK → Run workflow) to get them as
# downloads. Every push to main (a merged PR) publishes them as a new GitHub
# release (v0.1.<run number>); pushing a tag like v1.0.0 publishes that tag.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @malves/protocol build
      # Malves' calls: the Firebase file comes from a repository secret (never
      # committed). Without the secret the app builds the same, without calls.
      - name: Firebase file for calls
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > packages/app/google-services.json
          fi
      # Generates the native Android project from app.json (it isn't committed).
      - run: pnpm --filter @malves/app exec expo prebuild --platform android --no-install
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: packages/app/android
      - run: mv packages/app/android/app/build/outputs/apk/release/app-release.apk malves.apk
      # The Chrome extension (loaded unpacked: it isn't in the Web Store) and the IDE extension.
      - run: pnpm --filter @malves/extension build
      - run: cd packages/extension && zip -r ../../malves-chrome.zip manifest.json popup.html dist
      - run: pnpm --filter malves-ide package && mv packages/ide/malves.vsix malves.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: malves
          path: |
            malves.apk
            malves-chrome.zip
            malves.vsix
      - if: github.event_name == 'push'
        run: |
          tag="$GITHUB_REF_NAME"
          if [ "$GITHUB_REF_TYPE" = branch ]; then tag="v0.1.$GITHUB_RUN_NUMBER"; fi
          gh release create "$tag" malves.apk malves-chrome.zip malves.vsix --target "$GITHUB_SHA" --title "$tag" --notes-file .github/release-notes.md --latest
        env:
          GH_TOKEN: ${{ github.token }}
