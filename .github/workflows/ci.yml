name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Test
        run: pnpm test
        env:
          # The runner image ships Google Chrome; the browser gate test drives it.
          MALVES_TEST_CHROMIUM: /usr/bin/google-chrome
      - name: Bundle the Android app (JavaScript only)
        run: pnpm --filter @malves/app bundle
